name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [cursor/**]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (Pages preview base)
        env:
          SITE_BASE: /marketshare-africa
        run: npm run build

      - name: Guard against retired brand and domain strings
        run: |
          # Construct needles at runtime so this file does not contain the literals.
          BAD_DOMAIN="$(printf '%s%s' 'gmarketshare' '.com')"
          BAD_BRAND="$(printf '%s%s' 'GMarket' 'Share')"
          fail=0
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git -F "$BAD_DOMAIN" .; then
            echo "Found forbidden domain string" >&2
            fail=1
          fi
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git -F "$BAD_BRAND" .; then
            echo "Found forbidden brand string" >&2
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK: retired brand and domain strings absent"
